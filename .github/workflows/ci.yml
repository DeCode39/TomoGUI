name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      MPLCONFIGDIR: /tmp/tomogui-matplotlib
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[workflow,dev]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python release/audit_dist.py dist
      - run: python -m twine check dist/*
      - run: python release/check_version.py --tag "v$(python -c 'import tomogui; print(tomogui.__version__)')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-py${{ matrix.python }}
          path: dist/
