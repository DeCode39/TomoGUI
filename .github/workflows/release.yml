name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/tomogui-matplotlib
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[workflow,dev]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python release/audit_dist.py dist
      - run: python -m twine check dist/*
      - name: Verify version and prepare release assets
        run: |
          python release/check_version.py --tag "$GITHUB_REF_NAME" --notes dist/RELEASE_NOTES.md
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "TomoGUI $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
