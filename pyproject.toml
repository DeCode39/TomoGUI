[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomogui"
version = "0.1.0"
description = "A local visual preparation and inspection workspace for TomoATT"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "TomoGUI contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23,<3", "h5py>=3.8,<4", "PyYAML>=6,<7", "scipy>=1.10,<2", "pandas>=1.5,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
workflow = ["pytomoatt>=0.2.8,<0.4"]
dev = ["build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/DeCode39/TomoGUI"
Issues = "https://github.com/DeCode39/TomoGUI/issues"
Releases = "https://github.com/DeCode39/TomoGUI/releases"

[project.scripts]
tomogui = "tomogui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
tomogui = ["static/*", "assets/*", "resources/workflow/**/*", "resources/workflow/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
